<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gringotts Ledger | Add Transaction</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Text&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <nav class="marauders-nav">
        <div class="nav-logo">Gringotts</div>
        <ul>
            <li><a href="index.html">📜 Ledger</a></li>
            <li><a href="add.html" class="active">💰 Add Transaction</a></li>
            <li><a href="reports.html">📈 Reports</a></li>
        </ul>
    </nav>

    <main>
        <section id="add-transaction" class="glass-card fade-in">
            <h2>💰 Add New Transaction</h2>
            <form id="transaction-form">
                <input type="text" id="desc" placeholder="Reason (e.g., Potion Ingredients)" required />
                <input type="number" id="amount" placeholder="Amount in Galleons" required />
                <select id="type">
                    <option value="income">Deposit (Vault Credit)</option>
                    <option value="expense">Withdrawal (Vault Debit)</option>
                </select>
                <button type="submit">Commit to Ledger ⚡</button>
            </form>
        </section>
    </main>

    <footer><p>Mischief Managed. ✨</p></footer>
    <script src="js/app.js"></script>
</body>
</html>
